<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Password Generator</h1>
        <div>
            <label for="length">Password Length:</label>
            <input type="number" id="length" value="12" min="8" max="32">
        </div>
        <div>
            <label for="complexity">Complexity:</label>
            <select id="complexity">
                <option value="low">Low (Letters only)</option>
                <option value="medium">Medium (Letters + Numbers)</option>
                <option value="high">High (Letters + Numbers + Symbols)</option>
            </select>
        </div>
        <div>
            <button onclick="generatePassword()">Generate Password</button>
        </div>
        <div>
            <h3>Generated Password:</h3>
            <p id="password">Your password will appear here</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
